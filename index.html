<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generatore di Numeri Casuali</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=2">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-sm border-0 position-relative p-4">
          
          <!-- Pulsante di forzatura sempre visibile -->
          <button id="secret-trigger" type="button" class="secret-btn" title="Trucco attivo"></button>

          <div class="card-body p-0 text-center">
            <h3 class="card-title mb-4 fw-bold">Estrai Numeri</h3>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label text-muted small">Min </label>
                <input type="number" id="min-val" class="form-control text-center" value="1">
              </div>
              <div class="col-6">
                <label class="form-label text-muted small">Max</label>
                <input type="number" id="max-val" class="form-control text-center" value="100">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label text-muted small">Quanti numeri generare </label>
              <input type="number" id="count-val" class="form-control text-center" value="5" min="1" max="50">
            </div>

            <button id="generate-btn" class="btn btn-primary btn-lg w-100 mb-4 shadow-sm">
              Genera
            </button>

            <div id="results" class="d-flex flex-wrap justify-content-center gap-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
